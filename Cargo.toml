[package]
name = "velvet-hammer"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
base64 = "0.22"
getrandom = "0.3"
libc = "0.2"
portable-pty = "0.9"
# Rune is pinned to a rev of its `dev` branch, which is never rewritten. Bump all six revs together.
rune = { git = "https://github.com/anomalyco/rune", rev = "f3be67ace9631ea95565b5263f7aa7c9dd73cdb4", features = ["tooling"] }
# Rune's component kit, for its Markdown view of the chief of staff's messages (pulldown-cmark).
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "f3be67ace9631ea95565b5263f7aa7c9dd73cdb4", default-features = false, features = ["markdown"] }
serde_json = "1"
sha2 = "0.10"

# Rune patches these crates in its own workspace; a dependency's [patch] does not reach this one,
# so the app repeats Rune's [patch.crates-io] table from the same rev (see Rune's README,
# "Depending on Rune").
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "f3be67ace9631ea95565b5263f7aa7c9dd73cdb4" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "f3be67ace9631ea95565b5263f7aa7c9dd73cdb4" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "f3be67ace9631ea95565b5263f7aa7c9dd73cdb4" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "f3be67ace9631ea95565b5263f7aa7c9dd73cdb4" }
