<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="velvet" cx="38%" cy="28%" r="85%">
      <stop offset="0" stop-color="#b3204a"/>
      <stop offset="0.45" stop-color="#7d1235"/>
      <stop offset="1" stop-color="#2b0616"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe7b0"/>
      <stop offset="0.45" stop-color="#e2b55a"/>
      <stop offset="1" stop-color="#9c6b22"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8913a"/>
      <stop offset="1" stop-color="#f6dc98"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c0b10"/>
      <stop offset="0.5" stop-color="#4a2430"/>
      <stop offset="1" stop-color="#160709"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dx="0" dy="22" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#velvet)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>
  <g filter="url(#shadow)" transform="translate(70 36) rotate(-38 512 540)">
    <!-- handle -->
    <rect x="480" y="380" width="64" height="430" rx="32" fill="url(#handle)"/>
    <rect x="480" y="706" width="64" height="104" rx="32" fill="#e2b55a" opacity="0.18"/>
    <!-- head -->
    <rect x="322" y="268" width="380" height="132" rx="26" fill="url(#brass)"/>
    <rect x="322" y="268" width="380" height="20" rx="10" fill="#fff6d8" opacity="0.55"/>
    <rect x="292" y="280" width="52" height="108" rx="14" fill="url(#face)"/>
    <rect x="680" y="280" width="52" height="108" rx="14" fill="url(#face)"/>
    <rect x="470" y="268" width="84" height="132" fill="#000" opacity="0.10"/>
  </g>
</svg>
