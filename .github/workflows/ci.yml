name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Software Vulkan (lavapipe) for the headless renderer; the runner has no GPU or display.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 libxkbcommon-dev libwayland-dev libx11-dev
      # rustup reads rust-toolchain.toml; this installs the pinned toolchain.
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build, test and render headlessly
        run: scripts/verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify
          path: target/verify
          if-no-files-found: ignore
